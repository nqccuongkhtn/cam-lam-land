# ─────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel: đưa web (nginx:80) ra Internet qua domain của bạn.
# CHỈ thêm file này khi ĐÃ có TUNNEL_TOKEN trong .env:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tunnel.yml up -d
# (CHAY-SERVER.bat tự động thêm file này nếu phát hiện TUNNEL_TOKEN.)
# Trong Cloudflare Zero Trust: Public hostname → Service = HTTP → nginx:80
#
# ── ĐƯỜNG HẦM MẠNG RIÊNG + ĐỊA CHỈ CỐ ĐỊNH (29/9/2026 — rà soát bảo mật) ──────────
# Trước đây tunnel nằm chung mạng mặc định, địa chỉ đổi mỗi lần tạo lại → nginx không biết đâu
# là tunnel, nên máy chủ thấy MỌI khách cùng một IP (172.18.0.7 = tunnel): giới hạn tốc độ tính
# chung cho cả thiên hạ (một người spam là cả web bị chặn), khoá chống cào theo máy mất tác dụng.
# Nay tunnel CHỈ nằm trong mạng `duong_ham` với địa chỉ CỐ ĐỊNH 172.31.253.2; nginx (nginx.conf)
# chỉ tin header CF-Connecting-IP khi yêu cầu đến từ ĐÚNG địa chỉ này → ai vào thẳng cổng 80 trong
# mạng nội bộ mà tự khai header đó cũng vô ích. ⚠️ Đổi địa chỉ này thì đổi luôn set_real_ip_from.
# ─────────────────────────────────────────────────────────────────────────
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: camlam_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      duong_ham:
        ipv4_address: 172.31.253.2
  nginx:
    networks:
      default: {}
      duong_ham:
        ipv4_address: 172.31.253.3

networks:
  duong_ham:
    ipam:
      config:
        - subnet: 172.31.253.0/29
