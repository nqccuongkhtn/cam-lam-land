# Cam Lâm GIS + Real Estate platform — one-command local stack.
#   cp .env.example .env && docker compose up --build
# Then open http://localhost  (map loads on Cam Lâm, Khánh Hòa)
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: camlam_postgis
    restart: unless-stopped
    # Tinh chỉnh hiệu năng: tăng bộ nhớ đệm + tối ưu cho SSD → truy vấn bản đồ/tin nhanh hơn.
    # ⚠️ jit=off đặt bằng `ALTER SYSTEM SET jit = off` (29/9/2026) — lưu trong volume pgdata
    #    (postgresql.auto.conf), KHÔNG ghi vào đây để khỏi phải tạo lại container DB. JIT dịch
    #    câu lệnh ra mã máy: lợi cho truy vấn phân tích rất nặng, còn truy vấn web ngắn (vài ms)
    #    thì chỉ tốn thêm thời gian + RAM. Dựng DB mới từ đầu thì chạy lại lệnh đó.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=24MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # host:container — 5433 on the host avoids clashing with a local Postgres on 5432
      # ⚠️ 11/10/2026 (rà soát bảo mật): CHỈ mở trên chính máy chủ (127.0.0.1). Trước đây mở trên MỌI card mạng
      #    (0.0.0.0 và [::]) trong khi tường lửa Windows có sẵn luật cho "Docker Desktop Backend" nhận kết nối ở cả
      #    mạng Private lẫn Public → máy nào cùng mạng Wi-Fi/LAN cũng gõ được thẳng vào database (tài khoản quản trị
      #    database, mật khẩu mặc định nằm ngay dòng POSTGRES_PASSWORD phía trên). QGIS / công cụ chạy NGAY TRÊN máy
      #    chủ vẫn nối localhost:5433 như cũ; các script SAO-LUU/PHUC-HOI dùng "docker exec" nên không ảnh hưởng.
      #    Đổi dòng này chỉ có hiệu lực khi container postgis được TẠO LẠI (dữ liệu nằm ở volume pgdata, không mất).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camlam} -d ${POSTGRES_DB:-camlam_gis}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: camlam_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
      BACKEND_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-please_change_this_to_a_long_random_string}
      # Đăng nhập bằng vân tay / khuôn mặt (passkey). Khoá do máy người dùng sinh ra
      # được GẮN CHẶT vào một tên miền — đây chính là thứ chặn trang giả mạo xin chữ ký.
      # Sai tên miền là trình duyệt từ chối, không có cách nào lách.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@camlam.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      UPLOAD_DIR: /data/uploads
      # ── Chống cào: kiểm tra người thật Cloudflare Turnstile (để trống = tắt) + giới hạn ô tìm văn bản trang chủ ──
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      VB_TIM_5P: ${VB_TIM_5P:-}
      VB_TIM_NGAY: ${VB_TIM_NGAY:-}
      VB_TAT_CHONG_CAO: ${VB_TAT_CHONG_CAO:-}
      # ── AI đọc ảnh sổ đỏ / OCR (COPY KEY TỪ RENDER VÀO .env thì mới chạy) ──
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OCRSPACE_API_KEY: ${OCRSPACE_API_KEY:-}
      SELF_OCR_URL: ${SELF_OCR_URL:-}
      SELF_OCR_TOKEN: ${SELF_OCR_TOKEN:-}
      # ── Thông báo đẩy (push) ──
      VAPID_PUBLIC: ${VAPID_PUBLIC:-}
      VAPID_PRIVATE: ${VAPID_PRIVATE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # ── Email + Thanh toán/ngân hàng ──
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      PAYMENT_WEBHOOK_KEY: ${PAYMENT_WEBHOOK_KEY:-}
      BANK_ID: ${BANK_ID:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_NAME: ${BANK_NAME:-}
      # ── Kho hồ sơ: chìa khoá cho script tự đẩy file lên ──
      # ⚠️ ĐÃ VẤP: khai KHO_TOKEN trong .env nhưng QUÊN chuyền vào container này.
      #    Backend đọc process.env.KHO_TOKEN thấy rỗng nên TẮT HẲN đường "máy tự
      #    tải lên" → script TAI-LEN-KHO.ps1 đẩy file lên bị từ chối, mà thông báo
      #    lại chỉ nói "chưa đăng nhập" nên rất dễ tưởng sai chìa khoá.
      KHO_TOKEN: ${KHO_TOKEN:-}
      # ── Khác ──
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-12}
    volumes:
      - uploads:/data/uploads
      - logs:/app/apps/backend/logs        # GIỮ log lỗi/chậm qua các lần build lại
      - van_ban_kho:/app/.kho-van-ban      # file PDF văn bản đã tải sẵn — mở ngay, không mất khi dựng lại (6/10/2026)
      # LỚP QUY HOẠCH CHỈ ADMIN XEM (14/10/2026, routes/qhRieng.ts): ô ảnh + quyết định 1/500 chính thức Cam Lâm.
      # KHÔNG để chung volume camlam_tiles (nginx phục vụ thẳng /tiles/ cho mọi người) — chỉ backend đọc, có kiểm vé admin.
      # Nạp: scripts/qh-tinh/dua-len-web-14-10.sh (docker cp vào volume camlamgis_qh_rieng).
      # ⚠️ 16/10/2026 ĐỔI sang thư mục THẬT trên ổ D (chủ dự án: "lưu trữ ưu tiên ở ổ D, nếu trùng thì bỏ cái ổ C") — QH_RIENG_HOST_DIR
      # trong .env (máy chủ nhà = D:/KhoQH/qh-rieng, trước đó so từng tệp: trùng khít volume). Thêm lớp = chép thẳng vào thư mục đó.
      - ${QH_RIENG_HOST_DIR:-./du-lieu-ngoai/qh-rieng}:/app/apps/backend/du-lieu-rieng/qh-rieng:ro
      # KHOÁ QUY HOẠCH CAM LÂM (15/10/2026, chủ dự án: "ở Cam Lâm chỉ cho 893 là được xem free, còn lại khoá lại"): backend đọc CHỈ ĐỌC
      # kho ảnh công khai để phát ảnh QĐ205 + 7 bản phân khu qua /api/qh-rieng/t/… (vé admin); nginx chặn đường /tiles/qd205…,
      # /tiles/qd2076… với người ngoài. Dùng chung kho ô ảnh (16/10/2026: kho nằm ở ổ D — TILES_QG_DIR, xem nginx bên dưới).
      - ${TILES_QG_DIR:-./du-lieu-ngoai/tiles-qg}:/app/apps/backend/du-lieu-rieng/tiles-cong:ro
    depends_on:
      postgis:
        condition: service_healthy
    expose:
      - "4000"
    # Tự kiểm tra sức khoẻ backend (gồm cả DB qua /api/ping siêu nhẹ) → Docker báo unhealthy khi hỏng.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  gis-worker:
    build:
      context: .
      dockerfile: apps/gis-worker/Dockerfile
    container_name: camlam_gis_worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
      UPLOAD_DIR: /data/uploads
      WORKER_POLL_MS: ${WORKER_POLL_MS:-4000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Đổi DGN V8 → DXF qua mạng (GroupDocs, miễn phí). Lấy tại dashboard.groupdocs.cloud
      GROUPDOCS_CLIENT_ID: ${GROUPDOCS_CLIENT_ID:-}
      GROUPDOCS_CLIENT_SECRET: ${GROUPDOCS_CLIENT_SECRET:-}
    volumes:
      - uploads:/data/uploads
      - ./data/cam-lam:/data/cam-lam:ro
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: camlam_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
      # SSR (server component) gọi backend TRỰC TIẾP qua tên service nội bộ — thiếu biến này thì
      # các trang render sẵn (/nha-dat/*, /listings/[id], sitemap) trả RỖNG dù /api client vẫn chạy qua nginx.
      BACKEND_HOST: ${BACKEND_HOST:-http://backend:4000}
      NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-109.0917}
      NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-12.0771}
      NEXT_PUBLIC_MAP_ZOOM: ${NEXT_PUBLIC_MAP_ZOOM:-12}
      # ── AI BIÊN TẬP TIN TỨC ──
      # Trang /feed/news tự tải bài gốc rồi nhờ AI biên tập lại. KHÔNG có khoá ở
      # đây thì nó lặng lẽ bỏ qua bước biên tập và chỉ đăng lại đúng câu tóm tắt
      # của RSS → bài ra rất ngắn, đọc như lặp lại tiêu đề.
      # ⚠️ Khoá phải đặt ở CHÍNH service frontend này, không phải ở backend:
      #    /feed/news chạy trong tiến trình Next.js chứ không qua backend.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      # ── BỘ TILE BẢN ĐỒ (1,8 GB) ──
      # KHÔNG nướng vào ảnh Docker nữa (.dockerignore đã loại) vì mỗi lần sửa một dòng mã
      # là Docker chép lại nguyên 1,9 GB thành lớp mới → ăn ~5 GB ổ C mỗi lần dựng.
      #
      # Dùng VOLUME CỦA DOCKER chứ KHÔNG gắn thẳng thư mục Windows vào đây.
      # Lý do: trên Docker Desktop, thư mục Windows gắn vào container phải đi qua cầu nối
      # Windows↔Linux, đọc file nhỏ rất chậm — mà tile chính là hàng nghìn file .png nhỏ.
      # Volume của Docker nằm ngay trong kho (ext4) nên nhanh y như lúc nằm trong ảnh.
      # Đo thật trước khi đổi: 5–7 mili-giây một ô tile. Đổi xong phải đo lại cho bằng.
      #
      # Nạp lại bộ tile vào volume (chỉ làm khi thay bộ tile mới):
      #   docker run --rm -v camlam_tiles:/dest camlamgis-frontend:latest sh -c 'cp -a /app/public/tiles/. /dest/'
      # ⚠️ 16/10/2026 ĐỔI: kho ô ảnh chuyển hẳn ra Ổ D (chủ dự án: "lưu trữ ưu tiên ở ổ D, nếu trùng thì bỏ cái ổ C") — thư mục
      # TILES_QG_DIR (.env, máy chủ nhà = D:/KhoQH/tiles-qg), volume camlam_tiles đã bỏ. Đo lại trước khi đổi (400 ô, 8 luồng song song
      # qua nginx): lần đọc đầu ổ D 21 ms/ô (volume 8 ms), đọc lại 6 ms (volume 5 ms) — chấp nhận được vì Cloudflare giữ ô công khai 1 năm.
      # Thêm / thay bộ ô = chép thẳng vào thư mục đó (không cần docker cp nữa).
      - ${TILES_QG_DIR:-./du-lieu-ngoai/tiles-qg}:/app/public/tiles:ro
      # ── KHO TIN TỨC (29/9/2026) ── app/feed/news/route.ts ghi kho tin ra /app/.kho-tin/tin.json để
      # khởi động lại không mất bài. Nhưng thư mục đó nằm TRONG container → mỗi lần DỰNG LẠI web
      # (container mới) là mất sạch, lượt khách đầu tiên phải chờ ~11 giây tải lại tin (đo thật).
      # Gắn ra volume thì kho sống qua mọi lần dựng lại.
      - tin_kho:/app/.kho-tin
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: camlam_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/usr/share/nginx/maintenance:ro
      # Bộ tile bản đồ: để NGINX PHỤC VỤ THẲNG, không chuyển qua Next.js nữa.
      # Đo thật: qua Next.js mất 12-16 mili-giây một ô; nginx đọc file tĩnh nhanh hơn hẳn.
      # 16/10/2026: CẢ /tiles/ lẫn /tiles-qg/ đọc CÙNG một thư mục THẬT trên ổ D (TILES_QG_DIR trong .env; xem giải thích ở service
      # frontend). Máy không đặt biến này thì gắn thư mục rỗng trong repo (ô ảnh trả 404, web vẫn chạy bình thường).
      - ${TILES_QG_DIR:-./du-lieu-ngoai/tiles-qg}:/usr/share/nginx/tiles:ro
      - ${TILES_QG_DIR:-./du-lieu-ngoai/tiles-qg}:/usr/share/nginx/tiles-qg:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

volumes:
  # (16/10/2026 đã BỎ volume camlam_tiles — kho ô ảnh nằm ở ổ D, TILES_QG_DIR; xem lời giải thích ở service frontend.)
  # Kho tin tức đã biên tập (xem service frontend).
  tin_kho:
  # File PDF văn bản đã tải sẵn từ Drive / cổng TTĐT (xem routes/vanBan.ts).
  van_ban_kho:
  # (16/10/2026 đã BỎ volume qh_rieng — lớp quy hoạch riêng nằm ở ổ D, QH_RIENG_HOST_DIR; xem service backend.)

  pgdata:
  uploads:
  logs:
