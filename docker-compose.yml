# Cam Lâm GIS + Real Estate platform — one-command local stack.
#   cp .env.example .env && docker compose up --build
# Then open http://localhost  (map loads on Cam Lâm, Khánh Hòa)
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: camlam_postgis
    restart: unless-stopped
    # Tinh chỉnh hiệu năng: tăng bộ nhớ đệm + tối ưu cho SSD → truy vấn bản đồ/tin nhanh hơn.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=24MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # host:container — 5433 on the host avoids clashing with a local Postgres on 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camlam} -d ${POSTGRES_DB:-camlam_gis}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: camlam_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
      BACKEND_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-please_change_this_to_a_long_random_string}
      # Đăng nhập bằng vân tay / khuôn mặt (passkey). Khoá do máy người dùng sinh ra
      # được GẮN CHẶT vào một tên miền — đây chính là thứ chặn trang giả mạo xin chữ ký.
      # Sai tên miền là trình duyệt từ chối, không có cách nào lách.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@camlam.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      UPLOAD_DIR: /data/uploads
      # ── AI đọc ảnh sổ đỏ / OCR (COPY KEY TỪ RENDER VÀO .env thì mới chạy) ──
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OCRSPACE_API_KEY: ${OCRSPACE_API_KEY:-}
      SELF_OCR_URL: ${SELF_OCR_URL:-}
      SELF_OCR_TOKEN: ${SELF_OCR_TOKEN:-}
      # ── Thông báo đẩy (push) ──
      VAPID_PUBLIC: ${VAPID_PUBLIC:-}
      VAPID_PRIVATE: ${VAPID_PRIVATE:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # ── Email + Thanh toán/ngân hàng ──
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      PAYMENT_WEBHOOK_KEY: ${PAYMENT_WEBHOOK_KEY:-}
      BANK_ID: ${BANK_ID:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_NAME: ${BANK_NAME:-}
      # ── Khác ──
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-12}
    volumes:
      - uploads:/data/uploads
      - logs:/app/apps/backend/logs        # GIỮ log lỗi/chậm qua các lần build lại
    depends_on:
      postgis:
        condition: service_healthy
    expose:
      - "4000"
    # Tự kiểm tra sức khoẻ backend (gồm cả DB qua /api/ping siêu nhẹ) → Docker báo unhealthy khi hỏng.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  gis-worker:
    build:
      context: .
      dockerfile: apps/gis-worker/Dockerfile
    container_name: camlam_gis_worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-camlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camlam_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-camlam_gis}
      UPLOAD_DIR: /data/uploads
      WORKER_POLL_MS: ${WORKER_POLL_MS:-4000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Đổi DGN V8 → DXF qua mạng (GroupDocs, miễn phí). Lấy tại dashboard.groupdocs.cloud
      GROUPDOCS_CLIENT_ID: ${GROUPDOCS_CLIENT_ID:-}
      GROUPDOCS_CLIENT_SECRET: ${GROUPDOCS_CLIENT_SECRET:-}
    volumes:
      - uploads:/data/uploads
      - ./data/cam-lam:/data/cam-lam:ro
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: camlam_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
      # SSR (server component) gọi backend TRỰC TIẾP qua tên service nội bộ — thiếu biến này thì
      # các trang render sẵn (/nha-dat/*, /listings/[id], sitemap) trả RỖNG dù /api client vẫn chạy qua nginx.
      BACKEND_HOST: ${BACKEND_HOST:-http://backend:4000}
      NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-109.0917}
      NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-12.0771}
      NEXT_PUBLIC_MAP_ZOOM: ${NEXT_PUBLIC_MAP_ZOOM:-12}
      # ── AI BIÊN TẬP TIN TỨC ──
      # Trang /feed/news tự tải bài gốc rồi nhờ AI biên tập lại. KHÔNG có khoá ở
      # đây thì nó lặng lẽ bỏ qua bước biên tập và chỉ đăng lại đúng câu tóm tắt
      # của RSS → bài ra rất ngắn, đọc như lặp lại tiêu đề.
      # ⚠️ Khoá phải đặt ở CHÍNH service frontend này, không phải ở backend:
      #    /feed/news chạy trong tiến trình Next.js chứ không qua backend.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      # ── BỘ TILE BẢN ĐỒ (1,8 GB) ──
      # KHÔNG nướng vào ảnh Docker nữa (.dockerignore đã loại) vì mỗi lần sửa một dòng mã
      # là Docker chép lại nguyên 1,9 GB thành lớp mới → ăn ~5 GB ổ C mỗi lần dựng.
      #
      # Dùng VOLUME CỦA DOCKER chứ KHÔNG gắn thẳng thư mục Windows vào đây.
      # Lý do: trên Docker Desktop, thư mục Windows gắn vào container phải đi qua cầu nối
      # Windows↔Linux, đọc file nhỏ rất chậm — mà tile chính là hàng nghìn file .png nhỏ.
      # Volume của Docker nằm ngay trong kho (ext4) nên nhanh y như lúc nằm trong ảnh.
      # Đo thật trước khi đổi: 5–7 mili-giây một ô tile. Đổi xong phải đo lại cho bằng.
      #
      # Nạp lại bộ tile vào volume (chỉ làm khi thay bộ tile mới):
      #   docker run --rm -v camlam_tiles:/dest camlamgis-frontend:latest sh -c 'cp -a /app/public/tiles/. /dest/'
      - camlam_tiles:/app/public/tiles:ro
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: camlam_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/usr/share/nginx/maintenance:ro
      # Bộ tile bản đồ: để NGINX PHỤC VỤ THẲNG, không chuyển qua Next.js nữa.
      # Đo thật: qua Next.js mất 12-16 mili-giây một ô; nginx đọc file tĩnh nhanh hơn hẳn.
      - camlam_tiles:/usr/share/nginx/tiles:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

volumes:
  # Bộ tile bản đồ quy hoạch — xem lời giải thích ở service frontend.
  camlam_tiles:

  pgdata:
  uploads:
  logs:
