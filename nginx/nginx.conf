# Reverse proxy: / -> Next.js frontend, /api -> backend API.
upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream  { server backend:4000;  }

# ── Nén gzip: giảm mạnh dung lượng HTML/JS/CSS/JSON/GeoJSON (dữ liệu bản đồ) ──
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/geo+json
    application/xml application/rss+xml image/svg+xml font/ttf font/otf;

# ── Bộ nhớ đệm nginx: lưu ảnh tin + lớp bản đồ (backend cho phép cache) → không hỏi lại
#    database mỗi lần → nhanh hơn nhiều. Phần riêng tư / đã đăng nhập KHÔNG bị cache.
proxy_cache_path  /var/cache/nginx levels=1:2 keys_zone=camlam:20m max_size=1g inactive=7d use_temp_path=off;

# ── Thời hạn cache ẢNH BẢN ĐỒ theo KẾT QUẢ: chỉ ô ảnh CÓ THẬT (200) mới được giữ 1 năm.
#    ⚠️ Trước đây `add_header ... always` gắn "giữ 1 năm, bất biến" cho CẢ phản hồi 404. Hậu quả (chủ dự án chụp
#    15/9/2026): ai mở bản đồ lúc bộ QĐ205 chưa có ô mức 10–11 thì điện thoại + Cloudflare nhớ "không có ô này"
#    suốt 1 năm → cắt bù ô xong vẫn thấy bản đồ LỖ CHỖ, dù trên máy chủ ô đã đầy đủ.
map $status $cache_anh {
    200     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;   # allow large GIS file uploads (.dgn/.shp/.zip)

    # API
    location /api/ {
        proxy_pass         http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Cache theo Cache-Control của backend: ảnh (immutable), lớp bản đồ (120s)... được cache;
        # còn no-store / có đăng nhập (Authorization) thì KHÔNG cache → luôn dữ liệu mới.
        proxy_cache        camlam;
        proxy_cache_key    "$scheme$request_method$host$request_uri";
        proxy_cache_lock   on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache     $http_authorization;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header         X-Cache $upstream_cache_status always;
    }

    # WebSocket endpoint for live map updates (optional feature)
    location /ws {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── Tài nguyên bản đồ TĨNH & NẶNG (geojson/pmtiles/tiles/overlay) ──
    #    Cache LÂU để trình duyệt và Cloudflare chỉ tải 1 lần → mở bản đồ lần sau
    #    rất nhanh trên điện thoại (geojson vẫn được nén gzip ở khối gzip phía trên).
    location ~* \.(geojson|pmtiles)$ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=2592000" always;   # 30 ngày
    }
    # Tile bản đồ: nginx ĐỌC THẲNG TỪ Ổ ĐĨA, không chuyển tiếp sang Next.js.
    # Trước đây chuyển tiếp nên mỗi ô phải qua thêm một chặng và một tiến trình Node.
    # Đo thật: chuyển tiếp 12-16 mili-giây một ô, đọc thẳng nhanh hơn nhiều.
    # Thư mục gắn từ volume camlam_tiles (xem docker-compose.yml).
    location /tiles/ {
        alias      /usr/share/nginx/tiles/;
        add_header Cache-Control $cache_anh always;   # 200 giữ 1 năm, 404 KHÔNG giữ (xem map $cache_anh)
        access_log off;                               # hàng nghìn ô mỗi phiên, ghi log là phí
        try_files  $uri =404;
    }
    location /overlays/ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control $cache_anh always;
    }

    # ── ẢNH TĨNH CỦA WEB (banner, ảnh tin mẫu, ảnh Bãi Dài, biểu tượng) ──
    # ⚠️ ĐO THẬT MỚI PHÁT HIỆN: Next.js phục vụ thư mục `public/` với
    #    `Cache-Control: public, max-age=0`, tức lần nào trình duyệt cũng phải
    #    hỏi lại máy chủ. Trên trang chủ, ảnh nền banner 314 KB bị tải VE BA LẦN
    #    trong một lần vào trang (gần 1 MB thừa) — trên điện thoại 3G là rất nặng.
    #    Mấy ảnh này không bao giờ đổi nội dung mà giữ nguyên tên (đổi ảnh là đổi
    #    tên file), nên giữ lâu được.
    location ~* ^/(banner11|tin-mau|bai-dai|hero|icons|logo-le|chon-anh|vat3d|xe3d|co)/ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        # Giữ 7 NGÀY chứ không phải 1 năm: mấy thư mục này thỉnh thoảng có thay
        # ảnh mà GIỮ NGUYÊN TÊN FILE (nén lại cho nhẹ, đổi ảnh minh hoạ…). Giữ
        # 1 năm thì người đã vào web sẽ ôm ảnh cũ rất lâu. 7 ngày là đủ để hết
        # cảnh một tấm ảnh bị tải lại mấy lần trong cùng một lượt xem.
        add_header         Cache-Control "public, max-age=604800" always;
    }

    # Frontend (Next.js) — also handles HMR websocket in dev
    location / {
        # ── BẢO TRÌ THỦ CÔNG chỉ cho TÊN MIỀN (localhost vẫn vào bình thường để test) ──
        #   Bật:  docker exec camlam_nginx touch /etc/nginx/maintenance.on
        #   Tắt:  docker exec camlam_nginx rm -f /etc/nginx/maintenance.on
        #   (Nút "Bảo trì tên mien" trên bảng điều khiển làm 2 lệnh này giúp bạn.)
        set $maint "";
        if ($host = "batdongsancamlam.dpdns.org") { set $maint "P"; }
        if (-f /etc/nginx/maintenance.on)         { set $maint "${maint}M"; }
        if ($maint = "PM") { return 503; }

        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Khi frontend sập / đang khởi động lại → hiện trang bảo trì + game (không lỗi trắng).
        proxy_intercept_errors on;
        error_page 502 503 504 = @maintenance;
    }

    # ── ẢNH XEM THỬ cho chủ dự án duyệt màu bản đồ trước khi dựng ──────────────
    # Thư mục ./nginx đã được gắn sẵn vào container (xem docker-compose.yml) nên chỉ cần
    # chép ảnh vào ./nginx/xem/ là mở được bằng link, KHÔNG phải build lại frontend
    # (Next.js chỉ phục vụ file có trong thư mục public LÚC BUILD).
    # Đây là chỗ tạm để duyệt ảnh; duyệt xong xoá cả khối này và thư mục ./nginx/xem.
    location /xem/ {
        alias       /usr/share/nginx/maintenance/xem/;
        autoindex   on;
        add_header  Cache-Control "no-store" always;
    }

    # ── Trang bảo trì + game (bản riêng, tự chứa) — CHỈ dùng khi app lỗi mà nginx còn sống ──
    location @maintenance {
        root        /usr/share/nginx/maintenance;
        try_files   /maintenance.html =503;
        internal;
        default_type text/html;
        add_header  Retry-After 120 always;
        add_header  Cache-Control "no-store" always;
    }
}
