# Reverse proxy: / -> Next.js frontend, /api -> backend API.
# ── GIỮ KẾT NỐI ĐỂ DÙNG LẠI (keepalive) — tối ưu cho đông khách (29/9/2026) ──
#    Trước đây MỖI yêu cầu nginx mở một kết nối TCP mới tới Node rồi đóng ngay (mặc định
#    nginx gửi "Connection: close" lên upstream). Đông khách là tốn CPU + bộ nhớ cho việc
#    bắt tay/đóng kết nối liên tục, lại dễ cạn cổng tạm (TIME_WAIT). Nay giữ sẵn tối đa 64
#    kết nối rảnh mỗi phía để dùng lại. Cần kèm proxy_http_version 1.1 + Connection "".
upstream frontend_upstream { server frontend:3000; keepalive 64; keepalive_timeout 60s; }
upstream backend_upstream  { server backend:4000;  keepalive 64; keepalive_timeout 60s; }

# ── IP THẬT CỦA KHÁCH (29/9/2026 — rà soát bảo mật) ──
#    CHỈ tin header CF-Connecting-IP (Cloudflare gắn IP thật của khách) khi yêu cầu đến từ ĐÚNG địa
#    chỉ cố định của tunnel (docker-compose.tunnel.yml). Sau dòng này $remote_addr = IP thật của khách;
#    ai vào thẳng cổng 80 (mạng nội bộ) thì $remote_addr giữ IP thật của họ, header tự khai bị bỏ qua.
#    Trước đây backend thấy mọi khách cùng một IP (của tunnel) → giới hạn tốc độ tính chung cả web.
set_real_ip_from  172.31.253.2;
real_ip_header    CF-Connecting-IP;

# Chỉ gửi "Connection: upgrade" khi trình duyệt thật sự xin nâng lên WebSocket; còn lại để
# trống → kết nối lên Next.js được giữ lại dùng tiếp (trước đây luôn gửi "upgrade" nên hỏng keepalive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Nhớ sẵn thông tin file (có/không, kích thước) của ô bản đồ đọc thẳng từ đĩa → khỏi hỏi hệ
# điều hành mỗi lần. 20.000 mục ~ vài MB RAM của nginx.
open_file_cache          max=20000 inactive=120s;
open_file_cache_valid    120s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# ── Nén gzip: giảm mạnh dung lượng HTML/JS/CSS/JSON/GeoJSON (dữ liệu bản đồ) ──
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/geo+json
    application/xml application/rss+xml image/svg+xml font/ttf font/otf;

# ── Bộ nhớ đệm nginx: lưu ảnh tin + lớp bản đồ (backend cho phép cache) → không hỏi lại
#    database mỗi lần → nhanh hơn nhiều. Phần riêng tư / đã đăng nhập KHÔNG bị cache.
proxy_cache_path  /var/cache/nginx levels=1:2 keys_zone=camlam:20m max_size=1g inactive=7d use_temp_path=off;

# ── Thời hạn cache ẢNH BẢN ĐỒ theo KẾT QUẢ: chỉ ô ảnh CÓ THẬT (200) mới được giữ 1 năm.
#    ⚠️ Trước đây `add_header ... always` gắn "giữ 1 năm, bất biến" cho CẢ phản hồi 404. Hậu quả (chủ dự án chụp
#    15/9/2026): ai mở bản đồ lúc bộ QĐ205 chưa có ô mức 10–11 thì điện thoại + Cloudflare nhớ "không có ô này"
#    suốt 1 năm → cắt bù ô xong vẫn thấy bản đồ LỖ CHỖ, dù trên máy chủ ô đã đầy đủ.
map $status $cache_anh {
    200     "public, max-age=31536000, immutable";
    default "no-store";
}

# ⚠️ CÙNG MỘT CÁI BẪY, LẦN THỨ HAI (24/9/2026 — chủ dự án chụp "mất ảnh rồi"):
#    `add_header ... always` gắn luôn "giữ 7 ngày" cho CẢ trang lỗi 502 mà nginx
#    trả ra trong lúc container frontend đang dựng lại. Trình duyệt liền nhớ
#    "ảnh này hỏng" suốt 7 NGÀY — bấm F5 bao nhiêu lần cũng vô ích, vì nó không
#    hỏi lại máy chủ nữa. Ảnh tháp cổ ở banner mất đúng vì vậy, trong khi tệp
#    trên ổ đĩa vẫn còn nguyên và curl vẫn tải được.
#    ⇒ Chỉ phản hồi 200 mới được giữ lâu; mọi mã khác (404/500/502/503) KHÔNG giữ.
map $status $cache_anh_7ngay {
    200     "public, max-age=604800";
    default "no-store";
}
map $status $cache_logo_le {
    200     "public, max-age=3600";
    default "no-store";
}
map $status $cache_qh_30ngay {
    200     "public, max-age=2592000";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;   # allow large GIS file uploads (.dgn/.shp/.zip)

    # ── KHOÁ ĐĂNG NHẬP (passkey): tệp chuẩn W3C "Passkey Endpoints" (13/10/2026) ──
    #    Trình quản lý mật khẩu (Google Password Manager, iCloud…) đọc tệp này để đưa người dùng THẲNG tới chỗ bật / quản lý khoá
    #    Face ID · vân tay của web (trang Tài khoản). Chuẩn đòi: trả 200, kiểu application/json, KHÔNG chuyển hướng.
    location = /.well-known/passkey-endpoints {
        default_type application/json;
        add_header Cache-Control "public, max-age=86400" always;
        return 200 '{"enroll":"https://batdongsancamlam.dpdns.org/account","manage":"https://batdongsancamlam.dpdns.org/account"}';
    }

    # API
    location /api/ {
        proxy_pass         http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";   # giữ kết nối lên backend để dùng lại (keepalive)
        proxy_set_header   Host              $host;
        # IP THẬT đã xác minh (xem set_real_ip_from ở đầu tệp). GHI ĐÈ, không nối thêm: không để khách
        # tự chèn X-Forwarded-For / CF-Connecting-IP giả lọt vào backend.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Cache theo Cache-Control của backend: ảnh (immutable), lớp bản đồ (120s)... được cache;
        # còn no-store / có đăng nhập (Authorization) thì KHÔNG cache → luôn dữ liệu mới.
        proxy_cache        camlam;
        proxy_cache_key    "$scheme$request_method$host$request_uri";
        proxy_cache_lock   on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache     $http_authorization;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header         X-Cache $upstream_cache_status always;
    }

    # ── Ô BẢN ĐỒ ĐỊA CHÍNH: TUYỆT ĐỐI KHÔNG LƯU ĐỆM ở nginx ──
    #    Bốn lớp khoá chống cào (vé xem, hạn mức, đo độ phủ) chỉ chạy khi MỌI ô đều hỏi tới backend.
    #    nginx trả ô đã lưu là vô hiệu hết. (CLAUDE.md ghi có luật này nhưng tệp thật từng thiếu —
    #    rà soát 29/9/2026 bắt được; hiện backend trả 'private' nên chưa sao, thêm cho chắc.)
    location /api/dc/ {
        proxy_pass         http://backend_upstream/api/dc/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_read_timeout 60s;
        proxy_cache        off;
    }

    # ── LỚP QUY HOẠCH CHỈ ADMIN XEM (14/10/2026, routes/qhRieng.ts): TUYỆT ĐỐI KHÔNG LƯU ĐỆM ở nginx ──
    #    Mỗi ô phải hỏi tới backend để kiểm vé admin; nginx giữ ô lại là người khác xin cùng địa chỉ cũng được trả.
    location /api/qh-rieng/ {
        proxy_pass         http://backend_upstream/api/qh-rieng/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_read_timeout 60s;
        proxy_cache        off;
    }

    # WebSocket endpoint for live map updates (optional feature)
    location /ws {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── KHOÁ QUY HOẠCH CAM LÂM (15/10/2026, chủ dự án: "ở Cam Lâm chỉ cho 893 là được xem free, còn lại khoá lại") ──
    #    Ảnh QĐ205 + 7 bản phân khu 1/2000 KHÔNG còn phát công khai: admin xem qua /api/qh-rieng/t/… (backend kiểm vé từng ô).
    #    Các luật ~ này PHẢI đứng TRƯỚC "location ~* \.(geojson|pmtiles)$" (nginx xét luật mẫu theo thứ tự, gặp cái đầu là dùng)
    #    và thắng "location /tiles/" (luật tiền tố không có ^~ thì luật mẫu được ưu tiên).
    #    Cloudflare đã lỡ giữ bản sao các ô cũ ở biên tới 1 năm → chủ dự án phải bấm "Purge Everything" một lần trong Cloudflare.
    location ~ ^/tiles/(qd205|qd2076|qd2101|qd2222|qd918|qdcuhin|qdtaynam|qdtaybac)[a-z0-9]*/ { return 404; }
    #    Dữ liệu ô đất QĐ205 bản cũ từng nằm ở thư mục công khai (qh_vector… ~ 2 MB mỗi tệp) + ảnh QĐ205 + đường kéo qd205.pmtiles.
    location ~* ^/(qh_vector|qh_fill|qh_lines|qh_smooth|qh_precomputed)\.(geojson|json)$ { return 404; }
    location ~* ^/overlays/qd205 { return 404; }
    location ^~ /qhtiles { return 404; }

    # ── Tài nguyên bản đồ TĨNH & NẶNG (geojson/pmtiles/tiles/overlay) ──
    #    Cache LÂU để trình duyệt và Cloudflare chỉ tải 1 lần → mở bản đồ lần sau
    #    rất nhanh trên điện thoại (geojson vẫn được nén gzip ở khối gzip phía trên).
    location ~* \.(geojson|pmtiles)$ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control $cache_qh_30ngay always;   # 30 ngày, lỗi thì KHÔNG giữ
    }
    # Tile bản đồ: nginx ĐỌC THẲNG TỪ Ổ ĐĨA, không chuyển tiếp sang Next.js.
    # Trước đây chuyển tiếp nên mỗi ô phải qua thêm một chặng và một tiến trình Node.
    # Đo thật: chuyển tiếp 12-16 mili-giây một ô, đọc thẳng nhanh hơn nhiều.
    # Thư mục gắn từ volume camlam_tiles (xem docker-compose.yml).
    location /tiles/ {
        alias      /usr/share/nginx/tiles/;
        add_header Cache-Control $cache_anh always;   # 200 giữ 1 năm, 404 KHÔNG giữ (xem map $cache_anh)
        access_log off;                               # hàng nghìn ô mỗi phiên, ghi log là phí
        try_files  $uri =404;
    }
    # Ô ảnh QHSDĐ 2030 CÁC TỈNH KHÁC (16/10/2026) — đọc thẳng thư mục trên Ổ D của máy (TILES_QG_DIR trong .env, mặc định
    # D:/KhoQH/tiles-qg) thay vì volume trong kho Docker ở ổ C (ổ C chỉ còn vài GB; chủ dự án: "cứ để đỡ ở ổ D"). Chậm hơn /tiles/
    # một chút (đọc qua lớp chia sẻ ổ của Docker Desktop) nhưng Cloudflare giữ ô ở biên 1 năm nên ít khi phải đọc lại.
    location /tiles-qg/ {
        alias      /usr/share/nginx/tiles-qg/;
        add_header Cache-Control $cache_anh always;
        access_log off;
        try_files  $uri =404;
    }
    location /overlays/ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control $cache_anh always;
    }

    # ── ẢNH TĨNH CỦA WEB (banner, ảnh tin mẫu, ảnh Bãi Dài, biểu tượng) ──
    # ⚠️ ĐO THẬT MỚI PHÁT HIỆN: Next.js phục vụ thư mục `public/` với
    #    `Cache-Control: public, max-age=0`, tức lần nào trình duyệt cũng phải
    #    hỏi lại máy chủ. Trên trang chủ, ảnh nền banner 314 KB bị tải VE BA LẦN
    #    trong một lần vào trang (gần 1 MB thừa) — trên điện thoại 3G là rất nặng.
    #    Mấy ảnh này không bao giờ đổi nội dung mà giữ nguyên tên (đổi ảnh là đổi
    #    tên file), nên giữ lâu được.
    # ⚠️ LOGO NGÀY LỄ tách riêng, chỉ giữ 1 GIỜ. Bộ ảnh này đang được chỉnh
    #    đi chỉnh lại mà TÊN FILE GIỮ NGUYÊN, giữ 7 ngày thì sửa xong chủ dự
    #    án không thấy đổi, mà Cloudflare ở biên cũng ôm bản cũ cả tuần.
    #    Cả bộ chỉ ~1,3 MB nên tải lại cũng không đáng kể.
    location ~* ^/logo-le/ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control $cache_logo_le always;
    }
    location ~* ^/(banner11|tin-mau|bai-dai|hero|icons|chon-anh|vat3d|xe3d|co)/ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        # Giữ 7 NGÀY chứ không phải 1 năm: mấy thư mục này thỉnh thoảng có thay
        # ảnh mà GIỮ NGUYÊN TÊN FILE (nén lại cho nhẹ, đổi ảnh minh hoạ…). Giữ
        # 1 năm thì người đã vào web sẽ ôm ảnh cũ rất lâu. 7 ngày là đủ để hết
        # cảnh một tấm ảnh bị tải lại mấy lần trong cùng một lượt xem.
        add_header         Cache-Control $cache_anh_7ngay always;   # 7 ngày, lỗi thì KHÔNG giữ
    }

    # ── FILE GIAO DIỆN CỐ ĐỊNH CỦA NEXT.JS (/_next/static/) — nginx tự giữ & trả thẳng ──
    #    Tên file có sẵn mã băm nội dung (đổi nội dung là đổi tên) nên giữ được rất lâu.
    #    Trước đây lần nào cũng đi qua tiến trình Node → tốn CPU/RAM Node khi đông khách.
    #    Nay lần đầu hỏi Next.js, từ đó nginx trả thẳng từ bộ đệm của nó (X-Cache: HIT).
    #    Chỉ giữ mã 200 — lỗi 404/502 lúc đang dựng lại web KHÔNG được giữ.
    location /_next/static/ {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_cache        camlam;
        proxy_cache_key    "$scheme$host$request_uri";
        proxy_cache_valid  200 30d;
        proxy_cache_lock   on;
        add_header         X-Cache $upstream_cache_status always;
        access_log         off;
    }

    # ── sw.js + manifest: KHÔNG BAO GIỜ ĐƯỢC GIỮ (25/9/2026) ────────────────────
    # Trước đây Cloudflare giữ sw.js 4 TIẾNG → sửa web xong, điện thoại đã cài app
    # phải chờ tới 4 tiếng mới nhận bản mới (chủ dự án: "mãi chưa sửa"). Bộ phận
    # chạy ngầm cũ lại hiện trang cũ đã lưu. Phải luôn hỏi lại máy chủ.
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header         CDN-Cache-Control "no-store" always;
    }

    # Frontend (Next.js) — also handles HMR websocket in dev
    location / {
        # ── BẢO TRÌ THỦ CÔNG chỉ cho TÊN MIỀN (localhost vẫn vào bình thường để test) ──
        #   Bật:  docker exec camlam_nginx touch /etc/nginx/maintenance.on
        #   Tắt:  docker exec camlam_nginx rm -f /etc/nginx/maintenance.on
        #   (Nút "Bảo trì tên mien" trên bảng điều khiển làm 2 lệnh này giúp bạn.)
        set $maint "";
        if ($host = "batdongsancamlam.dpdns.org") { set $maint "P"; }
        if (-f /etc/nginx/maintenance.on)         { set $maint "${maint}M"; }
        if ($maint = "PM") { return 503; }

        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;   # chỉ "upgrade" khi cần, còn lại giữ kết nối
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   CF-Connecting-IP $remote_addr;
        # Header bảo mật cơ bản (29/9/2026): cấm nhúng web vào khung của trang lạ (chống lừa bấm),
        # cấm trình duyệt tự đoán loại file, không gửi đường dẫn đầy đủ sang trang khác.
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        # Khi frontend sập / đang khởi động lại → hiện trang bảo trì + game (không lỗi trắng).
        proxy_intercept_errors on;
        # =503: trang bảo trì trả MÃ 503 (tạm ngừng) chứ không phải 200. Trước đây "= @maintenance" lấy mã
        # của trang bảo trì (200) → Google tưởng là nội dung thật, có thể đưa trang bảo trì vào kết quả
        # tìm kiếm; công cụ theo dõi cũng tưởng web vẫn chạy (29/9/2026).
        error_page 502 503 504 =503 @maintenance;
    }

    # ⛔ Khối /xem/ (ảnh xem thử, bật liệt kê thư mục công khai) ĐÃ XOÁ 29/9/2026 — rà soát bảo mật.
    #    Cần lại thì thêm tạm, KHÔNG bật autoindex, duyệt xong xoá ngay.

    # ── Trang bảo trì + game (bản riêng, tự chứa) — CHỈ dùng khi app lỗi mà nginx còn sống ──
    location @maintenance {
        root        /usr/share/nginx/maintenance;
        try_files   /maintenance.html =503;
        internal;
        default_type text/html;
        add_header  Retry-After 120 always;
        add_header  Cache-Control "no-store" always;
    }
}
